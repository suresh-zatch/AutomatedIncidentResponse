<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Incident Response - Interactive Live Demo</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #07090e;
            --bg-card: rgba(15, 20, 32, 0.85);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-red: #ff3366;
            --accent-red-glow: rgba(255, 51, 102, 0.35);
            --accent-green: #00e676;
            --accent-cyan: #00e5ff;
            --accent-purple: #7c4dff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-main);
            min-height: 100vh;
            line-height: 1.5;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(124, 77, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 229, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 51, 102, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(7, 9, 14, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--bg-card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px;
            box-shadow: 0 0 20px var(--accent-red-glow);
        }
        .brand-text h1 { font-size: 20px; font-weight: 800; }
        .brand-text span { font-size: 12px; color: var(--accent-cyan); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
        
        .rec-badge {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 51, 102, 0.12); border: 1px solid rgba(255, 51, 102, 0.4);
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--accent-red);
        }
        .rec-dot {
            width: 10px; height: 10px; background-color: var(--accent-red); border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
        
        .grid-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff; }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
        
        select, input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--bg-card-border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: var(--font-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        select:focus, input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1); }

        .btn-trigger {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-red), #d50000);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s;
            box-shadow: 0 4px 15px var(--accent-red-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-trigger:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-red-glow); }
        .btn-trigger:active { transform: translateY(0); }
        .btn-trigger:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Terminal Window */
        .terminal-header {
            display: flex;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--bg-card-border);
            margin-bottom: 16px;
        }
        
        .mac-btns { display: flex; gap: 8px; margin-right: 20px; }
        .mac-btn { width: 12px; height: 12px; border-radius: 50%; }
        .mac-btn.close { background: #ff5f56; }
        .mac-btn.min { background: #ffbd2e; }
        .mac-btn.max { background: #27c93f; }
        
        .terminal-title { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
        .terminal-status { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--accent-green); display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }

        .terminal-content {
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            height: 500px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        .terminal-content::-webkit-scrollbar { width: 6px; }
        .terminal-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .terminal-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .terminal-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Terminal Log Styles */
        .log-line { margin-bottom: 6px; word-break: break-all; opacity: 0; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        
        .log-time { color: var(--text-muted); margin-right: 12px; }
        .log-info { color: var(--accent-cyan); }
        .log-warn { color: #ffbd2e; }
        .log-error { color: var(--accent-red); }
        .log-success { color: var(--accent-green); }
        .log-json { color: #e0e0e0; margin: 8px 0 16px 20px; white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 6px; border-left: 2px solid var(--accent-purple); }

        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .server-error { text-align: center; color: var(--accent-red); font-size: 14px; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">AIR</div>
            <div class="brand-text">
                <h1>Automated Incident Response</h1>
                <span>Interactive Live Demo</span>
            </div>
        </div>
        <div class="rec-badge">
            <div class="rec-dot"></div>
            LIVE PRODUCTION POC
        </div>
    </header>

    <div class="container">
        <div class="grid-layout">
            
            <!-- Controls Panel -->
            <div class="panel">
                <h2>Simulation Controls</h2>
                
                <div class="control-group">
                    <label>Incident Scenario</label>
                    <select id="scenario-select">
                        <option value="1">AWS - EC2 Malware Isolation</option>
                        <option value="2">AWS - IAM Credential Revocation</option>
                        <option value="3">GCP - GCE Firewall Quarantine</option>
                        <option value="4">GCP - SA Role Stripping</option>
                        <option value="5">Azure - VM NSG Isolation</option>
                        <option value="6">Azure - Entra ID Lockout</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Target Resource ID (Optional Override)</label>
                    <input type="text" id="resource-override" placeholder="e.g. i-0abcd12345678" />
                </div>

                <button id="trigger-btn" class="btn-trigger">
                    <div class="spinner" id="btn-spinner"></div>
                    <span id="btn-text">Execute Containment</span>
                </button>
                
                <div id="server-status" class="server-error"></div>
            </div>

            <!-- Terminal Panel -->
            <div class="panel">
                <div class="terminal-header">
                    <div class="mac-btns">
                        <div class="mac-btn close"></div>
                        <div class="mac-btn min"></div>
                        <div class="mac-btn max"></div>
                    </div>
                    <div class="terminal-title">user@air-controller: ~ (Interactive Mode)</div>
                    <div class="terminal-status" id="api-status">
                        <div class="status-dot"></div> API Connected
                    </div>
                </div>
                <div class="terminal-content" id="terminal-output">
                    <div class="log-line"><span class="log-info">Welcome to the Multi-Cloud Automated Incident Response Engine.</span></div>
                    <div class="log-line"><span class="log-info">System initialized. Awaiting incident trigger...</span></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5001/api";
        const terminal = document.getElementById('terminal-output');
        const triggerBtn = document.getElementById('trigger-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const statusDiv = document.getElementById('server-status');
        const apiStatus = document.getElementById('api-status');

        // Check backend health on load
        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                if(res.ok) {
                    apiStatus.innerHTML = '<div class="status-dot"></div> API Connected';
                    apiStatus.style.color = 'var(--accent-green)';
                }
            } catch(e) {
                apiStatus.innerHTML = '<div class="status-dot" style="background:#ff3366;box-shadow:0 0 8px #ff3366"></div> API Offline';
                apiStatus.style.color = 'var(--accent-red)';
                statusDiv.innerText = "Backend server not reachable. Please run `python server.py` in the terminal.";
                triggerBtn.disabled = true;
            }
        }
        checkHealth();

        function appendLog(message, type = 'info', isJson = false) {
            const line = document.createElement('div');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric", fractionalSecondDigits: 3 });
            
            if (isJson) {
                line.className = 'log-json';
                line.textContent = typeof message === 'string' ? message : JSON.stringify(message, null, 2);
            } else {
                line.className = 'log-line';
                let colorClass = 'log-info';
                if(type === 'error') colorClass = 'log-error';
                if(type === 'success') colorClass = 'log-success';
                if(type === 'warn') colorClass = 'log-warn';
                
                line.innerHTML = `<span class="log-time">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            }
            
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        triggerBtn.addEventListener('click', async () => {
            const scenarioId = document.getElementById('scenario-select').value;
            const resourceId = document.getElementById('resource-override').value;

            // UI State
            triggerBtn.disabled = true;
            btnText.innerText = "Executing...";
            btnSpinner.style.display = "block";
            statusDiv.innerText = "";
            
            appendLog(`--------------------------------------------------`);
            appendLog(`[SYSTEM] Initializing containment workflow for Scenario [${scenarioId}]...`, 'warn');

            try {
                const response = await fetch(`${API_URL}/trigger`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        scenario_id: scenarioId,
                        resource_id: resourceId 
                    })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    appendLog(`[ERROR] Containment execution failed: ${data.error || 'Unknown server error'}`, 'error');
                } else {
                    const result = data.containment_result;
                    
                    appendLog(`[${result.cloud_provider}] Incident ${result.incident_id} parsed successfully.`);
                    appendLog(`[ROUTING] Engine matched payload to containment module: ${result.containment_type}`);
                    
                    // Simulate step-by-step logging with slight delays for effect
                    for (let i = 0; i < result.steps.length; i++) {
                        const step = result.steps[i];
                        await new Promise(r => setTimeout(r, 600)); // Fake processing delay
                        appendLog(`[ACTION] Executing: ${step.action} on ${step.target || step.target_volume || step.target_instance}...`, 'info');
                        await new Promise(r => setTimeout(r, 400)); // Fake execution delay
                        appendLog(`[SUCCESS] ${step.action} completed with status: ${step.status}`, 'success');
                    }

                    await new Promise(r => setTimeout(r, 500));
                    appendLog(`[STATUS] Containment finalized. Engine returned structured payload:`, 'success');
                    appendLog(result, 'info', true);
                }

            } catch (error) {
                appendLog(`[FATAL] Connection to backend lost. Is the Flask server running?`, 'error');
                console.error(error);
            } finally {
                // Reset UI State
                triggerBtn.disabled = false;
                btnText.innerText = "Execute Containment";
                btnSpinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
